
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Used Car Shop | 二手车精选</title>
<style>
:root {
  --blue: #163B65;
  --light-blue: #68B7E8;
  --bg: #F5F8FC;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #172536;
}
header {
  background: var(--blue);
  color: white;
  padding: 20px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.logo { font-size: 22px; font-weight: bold; }
.logo span { color: var(--light-blue); }
button, select {
  padding: 11px 14px;
  border-radius: 8px;
  border: 1px solid #dce5ef;
  cursor: pointer;
}
header select { background: white; color: var(--blue); }
.hero {
  margin: 25px auto;
  max-width: 1100px;
  padding: 55px 7%;
  border-radius: 20px;
  background: var(--blue);
  color: white;
}
.hero h1 { font-size: clamp(32px, 5vw, 48px); }
.hero p { line-height: 1.8; color: #e0ebf6; }
.cta {
  background: var(--light-blue);
  color: #102b45;
  border: 0;
  font-weight: bold;
}
main { max-width: 1100px; margin: auto; padding: 0 18px 45px; }
.tools { display: flex; gap: 10px; margin: 25px 0; }
.tools input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #dce5ef;
  border-radius: 8px;
}
h2 { color: var(--blue); }
.cars {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 20px;
}
.car {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #dce5ef;
}
.car-image {
  background: #e4edf7;
  height: 165px;
  display: grid;
  place-items: center;
  font-size: 70px;
}
.car-info { padding: 18px; }
.price { color: var(--blue); font-size: 23px; font-weight: bold; }
.contact {
  display: inline-block;
  text-decoration: none;
  background: var(--blue);
  color: white;
  padding: 11px 14px;
  border-radius: 8px;
}
footer {
  background: var(--blue);
  color: white;
  text-align: center;
  padding: 28px 15px;
}
@media(max-width:500px) {
  .tools { flex-direction: column; }
  .hero { margin: 14px; padding: 30px 22px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">DRIVE<span>•</span>SELECT</div>
  <select id="language" onchange="changeLanguage()">
    <option value="zh">中文</option>
    <option value="en">English</option>
    <option value="ms">Bahasa Melayu</option>
  </select>
</header>

<section class="hero">
  <h1 id="heading">找到适合你的下一辆车。</h1>
  <p id="intro">精选二手车，价格清楚。欢迎预约看车，直接 WhatsApp 联系我们。</p>
  <button class="cta" onclick="document.getElementById('inventory').scrollIntoView({behavior:'smooth'})" id="browse">浏览车辆 ↓</button>
</section>

<main id="inventory">
  <h2 id="inventoryTitle">精选车辆</h2>
  <div class="tools">
    <input id="search" placeholder="搜索品牌或车型……" oninput="renderCars()">
  </div>
  <div class="cars" id="cars"></div>
</main>

<footer>
  <h3 id="footerTitle">想了解更多？欢迎联系。</h3>
  <p id="footerText">WhatsApp 联系我们，预约看车。</p>
  <a class="contact" href="https://wa.me/" target="_blank" rel="noopener" id="contact">WhatsApp 联系</a>
  <p style="font-size:12px">DRIVE•SELECT Used Cars</p>
</footer>

<script>
const vehicles = [
  {make:"Toyota",model:"Vios 1.5 G",year:2021,price:65800,emoji:"🚘"},
  {make:"Honda",model:"City 1.5 S",year:2020,price:59800,emoji:"🚗"},
  {make:"Perodua",model:"Myvi 1.5 H",year:2022,price:52800,emoji:"🚙"}
];

const translations = {
 zh:{
  heading:"找到适合你的下一辆车。",
  intro:"精选二手车，价格清楚。欢迎预约看车，直接 WhatsApp 联系我们。",
  browse:"浏览车辆 ↓",inventory:"精选车辆",
  search:"搜索品牌或车型……",footer:"想了解更多？欢迎联系。",
  footerText:"WhatsApp 联系我们，预约看车。",
  contact:"WhatsApp 联系"
 },
 en:{
  heading:"Find the right car for your next journey.",
  intro:"Explore selected used cars with clear pricing. Contact us on WhatsApp to arrange a viewing.",
  browse:"Browse Cars ↓",inventory:"Featured Cars",
  search:"Search make or model…",footer:"Want to know more?",
  footerText:"Message us on WhatsApp to arrange a viewing.",
  contact:"Contact on WhatsApp"
 },
 ms:{
  heading:"Cari kereta yang sesuai untuk anda.",
  intro:"Pilihan kereta terpakai dengan harga yang jelas. Hubungi kami melalui WhatsApp untuk melihat kereta.",
  browse:"Lihat Kereta ↓",inventory:"Kereta Pilihan",
  search:"Cari jenama atau model…",footer:"Ingin tahu lebih lanjut?",
  footerText:"Hubungi kami melalui WhatsApp untuk melihat kereta.",
  contact:"Hubungi WhatsApp"
 }
};

function changeLanguage() {
 const t = translations[document.getElementById("language").value];
 for (const id of ["heading","intro","browse","inventoryTitle","footerTitle","footerText","contact"]) {
   document.getElementById(id).textContent = t[id];
 }
 document.getElementById("search").placeholder = t.search;
 renderCars();
}

function renderCars() {
 const term = document.getElementById("search").value.toLowerCase();
 const list = vehicles.filter(v => (v.make+" "+v.model).toLowerCase().includes(term));
 document.getElementById("cars").innerHTML = list.map(v => `
  <article class="car">
   <div class="car-image">${v.emoji}</div>
   <div class="car-info">
    <h3>${v.make} ${v.model}</h3>
    <p>${v.year} · Automatic</p>
    <div class="price">RM ${v.price.toLocaleString()}</div>
    <p><a class="contact" target="_blank" rel="noopener"
      href="https://wa.me/?text=${encodeURIComponent("Hi, I'm interested in the "+v.year+" "+v.make+" "+v.model)}">WhatsApp Enquiry</a></p>
   </div>
  </article>
 `).join("");
}
renderCars();
</script>
</body>
</html>
